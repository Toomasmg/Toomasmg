<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7F1D1D"/>
      <stop offset="0.55" stop-color="#B91C1C"/>
      <stop offset="1" stop-color="#450A0A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <!-- thin frame -->
  <rect x="24" y="24" width="1152" height="252" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
  <!-- top-right monogram -->
  <text x="1120" y="92" text-anchor="end" font-family="Inter Display, Inter, Roboto, sans-serif" font-weight="300" font-size="22" fill="#FFFFFF" fill-opacity="0.7" letter-spacing="6">MENDOZA · ARGENTINA</text>
  <!-- name -->
  <text x="96" y="152" font-family="Inter Display, Inter, Roboto, sans-serif" font-weight="700" font-size="80" fill="#FFFFFF" letter-spacing="-1.5">Tomás Muñoz</text>
  <line x1="96" y1="178" x2="236" y2="178" stroke="#FFFFFF" stroke-width="2"/>
  <text x="96" y="222" font-family="Inter Display, Inter, Roboto, sans-serif" font-weight="400" font-size="30" fill="#FFFFFF" fill-opacity="0.92" letter-spacing="3">DESARROLLADOR DE SOFTWARE</text>
  <text x="96" y="256" font-family="Inter Display, Inter, Roboto, sans-serif" font-weight="400" font-size="18" fill="#FFFFFF" fill-opacity="0.6" letter-spacing="2">Desarrollo web · Sistemas a medida · Inteligencia artificial</text>
</svg>
